<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EcoRuta Escolar</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background:
                linear-gradient(
                    135deg,
                    #dcfce7,
                    #f0fdf4,
                    #bbf7d0
                );
            min-height: 100vh;
        }

        .pantalla-bienvenida {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            overflow: hidden;
            position: relative;
        }

        .circulo {
            position: absolute;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            animation: flotar 5s ease-in-out infinite;
        }

        .circulo-1 {
            width: 180px;
            height: 180px;
            top: 8%;
            left: 7%;
        }

        .circulo-2 {
            width: 120px;
            height: 120px;
            right: 10%;
            top: 16%;
            animation-delay: 1s;
        }

        .circulo-3 {
            width: 220px;
            height: 220px;
            right: 5%;
            bottom: 4%;
            animation-delay: 2s;
        }

        .contenedor-bienvenida {
            width: 100%;
            max-width: 720px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 30px;
            padding: 45px 35px;
            text-align: center;
            box-shadow:
                0 20px 50px rgba(22, 101, 52, 0.18);
            position: relative;
            z-index: 2;
            animation: aparecer 0.9s ease;
        }

        .logo-app {
            width: 125px;
            height: 125px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #15803d
                );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            box-shadow:
                0 12px 30px rgba(21, 128, 61, 0.3);
            animation: latido 2.2s infinite;
        }

        h1 {
            margin: 0;
            color: #14532d;
            font-size: 42px;
        }

        .subtitulo {
            margin-top: 12px;
            color: #166534;
            font-size: 19px;
            line-height: 1.6;
        }

        .beneficios {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 30px 0;
        }

        .beneficio {
            padding: 17px 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 18px;
            color: #14532d;
            font-weight: bold;
        }

        .beneficio span {
            display: block;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .boton-comenzar {
            display: inline-block;
            width: 100%;
            max-width: 430px;
            padding: 17px 25px;
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #15803d
                );
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-size: 19px;
            font-weight: bold;
            box-shadow:
                0 10px 25px rgba(21, 128, 61, 0.28);
            transition: 0.25s;
        }

        .boton-comenzar:hover {
            transform: translateY(-3px);
            box-shadow:
                0 14px 30px rgba(21, 128, 61, 0.35);
        }

        .pie-bienvenida {
            margin-top: 25px;
            color: #4b5563;
            font-size: 14px;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes latido {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }
        }

        @keyframes flotar {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        @media (max-width: 700px) {
            .contenedor-bienvenida {
                padding: 35px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 17px;
            }

            .beneficios {
                grid-template-columns: 1fr;
            }

            .logo-app {
                width: 105px;
                height: 105px;
                font-size: 52px;
            }
        }
    </style>
</head>

<body>

<section class="pantalla-bienvenida">

    <div class="circulo circulo-1"></div>
    <div class="circulo circulo-2"></div>
    <div class="circulo circulo-3"></div>

    <div class="contenedor-bienvenida">

        <div class="logo-app">
            🌳
        </div>

        <h1>EcoRuta Escolar</h1>

        <p class="subtitulo">
            Encuentra una ruta más saludable,
            tranquila y amigable con el ambiente
            para llegar a tu colegio.
        </p>

        <div class="beneficios">

            <div class="beneficio">
                <span>🌬️</span>
                Mejor ambiente
            </div>

            <div class="beneficio">
                <span>🔊</span>
                Menos ruido
            </div>

            <div class="beneficio">
                <span>🌳</span>
                Más áreas verdes
            </div>

        </div>

        <a
            href="buscar.html"
            class="boton-comenzar"
        >
            🚀 Comenzar recorrido
        </a>

        <p class="pie-bienvenida">
            Proyecto Eureka 2026 · EcoRuta Escolar
        </p>

    </div>

</section>

</body>
</html>
