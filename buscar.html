<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Buscar Ruta - EcoRuta Escolar</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .buscador-contenedor {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .formulario-ruta {
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow:
                0 14px 35px rgba(22, 101, 52, 0.15);
        }

        .campo-ruta {
            margin-bottom: 22px;
            text-align: left;
        }

        .campo-ruta label {
            display: block;
            margin-bottom: 9px;
            color: #14532d;
            font-size: 17px;
            font-weight: bold;
        }

        .campo-ruta input {
            width: 100%;
            padding: 15px 16px;
            border: 2px solid #bbf7d0;
            border-radius: 14px;
            outline: none;
            font-size: 16px;
            transition: 0.2s;
        }

        .campo-ruta input:focus {
            border-color: #22c55e;
            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        .nota-privacidad {
            margin: 10px 0 22px;
            padding: 12px 14px;
            border-radius: 13px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            font-size: 14px;
            line-height: 1.5;
        }

        .boton-principal {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #15803d
                );
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
        }

        .boton-principal:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 24px rgba(21, 128, 61, 0.25);
        }

        .boton-principal:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .volver-inicio {
            display: inline-block;
            margin-top: 18px;
            color: #166534;
            text-decoration: none;
            font-weight: bold;
        }

        .volver-inicio:hover {
            text-decoration: underline;
        }

        .pantalla-carga {
            display: none;
            position: fixed;
            z-index: 5000;
            inset: 0;
            background:
                linear-gradient(
                    135deg,
                    rgba(220, 252, 231, 0.97),
                    rgba(240, 253, 244, 0.98)
                );
            align-items: center;
            justify-content: center;
            padding: 22px;
        }

        .carga-contenido {
            width: 100%;
            max-width: 560px;
            background: white;
            border-radius: 26px;
            padding: 35px 28px;
            text-align: center;
            box-shadow:
                0 20px 50px rgba(22, 101, 52, 0.2);
            animation: aparecerCarga 0.35s ease;
        }

        .icono-carga {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #15803d
                );
            font-size: 46px;
            animation: pulso 1.5s infinite;
        }

        .carga-contenido h2 {
            margin: 0 0 10px;
            color: #14532d;
        }

        .mensaje-carga {
            min-height: 28px;
            margin: 12px 0 20px;
            color: #166534;
            font-size: 17px;
            font-weight: bold;
        }

        .barra-carga {
            width: 100%;
            height: 18px;
            overflow: hidden;
            background: #d1d5db;
            border-radius: 999px;
        }

        .progreso-carga {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background:
                linear-gradient(
                    90deg,
                    #22c55e,
                    #15803d
                );
            transition: width 0.55s ease;
        }

        .porcentaje-carga {
            margin-top: 10px;
            color: #14532d;
            font-size: 18px;
            font-weight: bold;
        }

        .pasos-carga {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 24px;
        }

        .paso {
            padding: 11px 8px;
            border-radius: 12px;
            background: #f8fafc;
            color: #64748b;
            font-size: 13px;
            font-weight: bold;
            transition: 0.25s;
        }

        .paso.activo {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        @keyframes aparecerCarga {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulso {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        @media (max-width: 650px) {
            .formulario-ruta {
                padding: 23px 18px;
            }

            .pasos-carga {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🌳 EcoRuta Escolar</h1>
    <p>Buscar Ruta Saludable</p>
</header>

<section class="hero">

    <div class="buscador-contenedor">

        <div class="formulario-ruta">

            <h2>📍 Planifica tu recorrido</h2>

            <div class="campo-ruta">

                <label for="direccionInicio">
                    ¿Desde dónde sales?
                </label>

                <input
                    type="text"
                    id="direccionInicio"
                    placeholder="Ejemplo: Sucre con Grau, Chiclayo"
                    autocomplete="street-address"
                >

            </div>

            <div class="campo-ruta">

                <label for="colegioDestino">
                    ¿A qué colegio vas?
                </label>

                <input
                    type="text"
                    id="colegioDestino"
                    placeholder="Ejemplo: Karl Weiss, Chiclayo"
                    value="Karl Weiss, Chiclayo"
                >

            </div>

            <div class="nota-privacidad">
                🔒 Para este prototipo se usa una zona de salida
                aproximada y no se muestra una vivienda exacta.
            </div>

            <button
                id="buscarRuta"
                class="boton-principal"
            >
                🔍 Buscar la mejor ruta
            </button>

            <a
                href="index.html"
                class="volver-inicio"
            >
                🏠 Volver al inicio
            </a>

        </div>

    </div>

</section>

<div
    class="pantalla-carga"
    id="pantallaCarga"
>

    <div class="carga-contenido">

        <div class="icono-carga">
            🌳
        </div>

        <h2>Analizando EcoRuta</h2>

        <p
            class="mensaje-carga"
            id="mensajeCarga"
        >
            Preparando el análisis...
        </p>

        <div class="barra-carga">

            <div
                class="progreso-carga"
                id="progresoCarga"
            ></div>

        </div>

        <div
            class="porcentaje-carga"
            id="porcentajeCarga"
        >
            0%
        </div>

        <div class="pasos-carga">

            <div
                class="paso"
                id="pasoVegetacion"
            >
                🌳 Vegetación
            </div>

            <div
                class="paso"
                id="pasoTrafico"
            >
                🚦 Tráfico
            </div>

            <div
                class="paso"
                id="pasoAmbiente"
            >
                🌬 Ambiente
            </div>

        </div>

    </div>

</div>

<script>
document.addEventListener(
    "DOMContentLoaded",
    function () {

        const botonBuscar =
            document.getElementById("buscarRuta");

        const direccionInicio =
            document.getElementById("direccionInicio");

        const colegioDestino =
            document.getElementById("colegioDestino");

        const pantallaCarga =
            document.getElementById("pantallaCarga");

        const mensajeCarga =
            document.getElementById("mensajeCarga");

        const progresoCarga =
            document.getElementById("progresoCarga");

        const porcentajeCarga =
            document.getElementById("porcentajeCarga");

        const pasoVegetacion =
            document.getElementById("pasoVegetacion");

        const pasoTrafico =
            document.getElementById("pasoTrafico");

        const pasoAmbiente =
            document.getElementById("pasoAmbiente");


        function actualizarCarga(
            porcentaje,
            mensaje,
            pasoActivo
        ) {

            progresoCarga.style.width =
                porcentaje + "%";

            porcentajeCarga.textContent =
                porcentaje + "%";

            mensajeCarga.textContent =
                mensaje;

            pasoVegetacion.classList.remove("activo");
            pasoTrafico.classList.remove("activo");
            pasoAmbiente.classList.remove("activo");

            if (pasoActivo === "vegetacion") {
                pasoVegetacion.classList.add("activo");
            }

            if (pasoActivo === "trafico") {
                pasoTrafico.classList.add("activo");
            }

            if (pasoActivo === "ambiente") {
                pasoAmbiente.classList.add("activo");
            }
        }


        function iniciarAnimacion() {

            pantallaCarga.style.display =
                "flex";

            botonBuscar.disabled =
                true;

            actualizarCarga(
                10,
                "📍 Ubicando el punto de salida...",
                ""
            );

            setTimeout(
                function () {
                    actualizarCarga(
                        30,
                        "🌳 Analizando vegetación cercana...",
                        "vegetacion"
                    );
                },
                650
            );

            setTimeout(
                function () {
                    actualizarCarga(
                        55,
                        "🚦 Revisando tráfico y cruces...",
                        "trafico"
                    );
                },
                1400
            );

            setTimeout(
                function () {
                    actualizarCarga(
                        78,
                        "🌬 Analizando ruido y calidad ambiental...",
                        "ambiente"
                    );
                },
                2200
            );

            setTimeout(
                function () {
                    actualizarCarga(
                        94,
                        "🛣️ Calculando la ruta saludable...",
                        "ambiente"
                    );
                },
                3000
            );

            setTimeout(
                function () {
                    actualizarCarga(
                        100,
                        "✅ Ruta saludable encontrada",
                        "ambiente"
                    );
                },
                3650
            );

            setTimeout(
                function () {
                    window.location.href =
                        "resultado.html";
                },
                4300
            );
        }


        botonBuscar.addEventListener(
            "click",
            function () {

                const inicio =
                    direccionInicio.value.trim();

                const destino =
                    colegioDestino.value.trim();

                if (inicio === "") {

                    alert(
                        "📍 Escribe desde dónde sales."
                    );

                    direccionInicio.focus();

                    return;
                }

                if (destino === "") {

                    alert(
                        "🏫 Escribe el nombre del colegio."
                    );

                    colegioDestino.focus();

                    return;
                }

                localStorage.setItem(
                    "ecorutaInicio",
                    inicio
                );

                localStorage.setItem(
                    "ecorutaDestino",
                    destino
                );

                iniciarAnimacion();
            }
        );


        direccionInicio.addEventListener(
            "keydown",
            function (evento) {

                if (evento.key === "Enter") {
                    botonBuscar.click();
                }
            }
        );


        colegioDestino.addEventListener(
            "keydown",
            function (evento) {

                if (evento.key === "Enter") {
                    botonBuscar.click();
                }
            }
        );

    }
);
</script>

</body>
</html>
